[package]
name = "vinpst-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "vinpst-gui"
path = "src/main.rs"

[dependencies]
iced.workspace = true
rfd.workspace = true
rustix.workspace = true
xattr.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
vinpst-audio = { path = "../vinpst-audio", features = ["pipewire-backend"] }
vinpst-config = { path = "../vinpst-config" }
vinpst-daemon-control = { path = "../vinpst-daemon-control" }
vinpst-http = { path = "../vinpst-http" }
vinpst-protocol = { path = "../vinpst-protocol" }
vinpst-registry = { path = "../vinpst-registry" }
vinpst-text = { path = "../vinpst-text" }
zbus = { workspace = true, features = ["blocking-api"] }

[dev-dependencies]
tempfile.workspace = true
